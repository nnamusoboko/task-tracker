[project]
name = "task-tracker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
task-cli = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
